name: Deploy to GitHub Pages

# Builds the portal and publishes it as a static site. Runs on every push to main, and can be
# started by hand from the Actions tab.
#
# One-time setup in the repo: Settings > Pages > Source: "GitHub Actions".
# Backend address: Settings > Secrets and variables > Actions > Variables > VITE_API_BASE
# (e.g. https://api.example.com/api/v1). Without it the site loads but tells the user it is not
# connected to a server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Compute base path
        # A user/org site repo (<owner>.github.io) is served at the domain root; any other repo is
        # served under /<repo-name>/.
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
